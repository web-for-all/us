<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل تتبع الأدوية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 20px 15px;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 420px;
            border-radius: 20px;
            padding: 25px 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        h1 {
            color: #2c3e50;
            font-size: 22px;
            margin-bottom: 20px;
        }

        .card {
            background-color: #eef2f5;
            border-radius: 15px;
            padding: 18px;
            margin-bottom: 20px;
            border: 1px solid #dcdfe3;
        }

        .card-title {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 8px;
        }

        .time-display {
            font-size: 17px;
            font-weight: bold;
            color: #2c3e50;
            line-height: 1.5;
        }

        .elapsed-time {
            font-size: 13px;
            color: #27ae60;
            margin-top: 6px;
            font-weight: 600;
        }

        .btn-main {
            width: 100%;
            background-color: #3498db;
            color: white;
            border: none;
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(52, 152, 219, 0.3);
            transition: background-color 0.2s, transform 0.1s;
            margin-bottom: 25px;
        }

        .btn-main:active {
            transform: scale(0.98);
            background-color: #2980b9;
        }

        .history-section {
            text-align: right;
            border-top: 2px dashed #e2e8f0;
            padding-top: 20px;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .history-title {
            font-size: 16px;
            color: #34495e;
            font-weight: bold;
        }

        .btn-clear-all {
            background: none;
            border: none;
            color: #e74c3c;
            font-size: 12px;
            cursor: pointer;
            text-decoration: underline;
        }

        .history-list {
            list-style: none;
            max-height: 250px;
            overflow-y: auto;
            padding-left: 5px;
        }

        .history-item {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #2c3e50;
        }

        .btn-delete-item {
            background: none;
            border: none;
            color: #a0aec0;
            font-size: 15px;
            cursor: pointer;
            padding: 2px 6px;
        }

        .btn-delete-item:hover {
            color: #e74c3c;
        }

        .empty-state {
            color: #95a5a6;
            font-size: 14px;
            text-align: center;
            padding: 15px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>تتبع موعد الدواء 💊</h1>

        <div class="card">
            <div class="card-title">آخر جرعة تم تناولها:</div>
            <div id="lastTimeDisplay" class="time-display empty-state">
                لم يتم تسجيل أي جرعة بعد
            </div>
            <div id="elapsedDisplay" class="elapsed-time"></div>
        </div>

        <button class="btn-main" onclick="recordMedication()">
            أخذت الدواء الآن ✅
        </button>

        <div class="history-section">
            <div class="history-header">
                <span class="history-title">سجل الجرعات السابقة:</span>
                <button class="btn-clear-all" onclick="clearAllHistory()">مسح السجل بالكامل</button>
            </div>
            <ul id="historyList" class="history-list">
                <!-- يتم إضافة التواريخ هنا ديناميكياً -->
            </ul>
        </div>
    </div>

    <script>
        function getHistory() {
            const history = localStorage.getItem('medicationHistory');
            return history ? JSON.parse(history) : [];
        }

        function saveHistory(historyArray) {
            localStorage.setItem('medicationHistory', JSON.stringify(historyArray));
        }

        function recordMedication() {
            const now = new Date();
            const timestamp = now.getTime();
            
            const history = getHistory();
            history.unshift(timestamp); // إضافة التسجيل الجديد في بداية القائمة
            
            saveHistory(history);
            updateDisplay();
        }

        function updateDisplay() {
            const history = getHistory();
            const lastTimeDisplay = document.getElementById('lastTimeDisplay');
            const elapsedDisplay = document.getElementById('elapsedDisplay');
            const historyList = document.getElementById('historyList');

            historyList.innerHTML = '';

            if (history.length === 0) {
                lastTimeDisplay.innerText = 'لم يتم تسجيل أي جرعة بعد';
                lastTimeDisplay.classList.add('empty-state');
                elapsedDisplay.innerText = '';
                historyList.innerHTML = '<li class="empty-state">لا يوجد سجلات حالياً</li>';
                return;
            }

            lastTimeDisplay.classList.remove('empty-state');

            // عرض الجرعة الأخيرة
            const lastDate = new Date(history[0]);
            lastTimeDisplay.innerText = formatDate(lastDate);
            calculateElapsedTime(lastDate);

            // عرض القائمة الكاملة
            history.forEach(function(timestamp, index) {
                const date = new Date(timestamp);
                const li = document.createElement('li');
                li.className = 'history-item';
                
                li.innerHTML = `
                    <span>#${history.length - index} - ${formatDate(date)}</span>
                    <button class="btn-delete-item" onclick="deleteHistoryItem(${index})" title="حذف">✕</button>
                `;
                
                historyList.appendChild(li);
            });
        }

        function formatDate(date) {
            const options = {
                weekday: 'short',
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                hour12: true
            };
            return date.toLocaleDateString('ar-SA', options);
        }

        function calculateElapsedTime(lastDate) {
            const now = new Date();
            const diffMs = now - lastDate;
            
            const diffMinutes = Math.floor(diffMs / (1000 * 60));
            const hours = Math.floor(diffMinutes / 60);
            const minutes = diffMinutes % 60;

            const elapsedDisplay = document.getElementById('elapsedDisplay');
            
            if (hours > 0) {
                elapsedDisplay.innerText = `(مضى على آخر جرعة: ${hours} ساعة و ${minutes} دقيقة)`;
            } else {
                elapsedDisplay.innerText = `(مضى على آخر جرعة: ${minutes} دقيقة)`;
            }
        }

        function deleteHistoryItem(index) {
            const history = getHistory();
            history.splice(index, 1);
            saveHistory(history);
            updateDisplay();
        }

        function clearAllHistory() {
            if (confirm('هل أنت تأكد من رغبتك في مسح السجل بالكامل؟')) {
                localStorage.removeItem('medicationHistory');
                updateDisplay();
            }
        }

        window.onload = function() {
            updateDisplay();
            setInterval(updateDisplay, 60000); // تحديث الوقت المنقضي كل دقيقة
        };
    </script>

</body>
</html>
