<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جدول المذاكرة</title>

  <!-- SVG Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%' y1='0%' x2='100%' y2='100%'><stop offset='0%' stop-color='%2310b981'/><stop offset='100%' stop-color='%2306b6d4'/></linearGradient></defs><rect width='100' height='100' rx='25' fill='url(%23g)'/><path d='M25 32 L50 20 L75 32 L50 44 Z M35 45 L35 65 Q50 75 65 65 L65 45' fill='none' stroke='%23ffffff' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/></svg>">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;600;700;800&family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#10b981', 600: '#059669' }
          },
          fontFamily: {
            cairo: ['Cairo', 'sans-serif'],
            tajawal: ['Tajawal', 'sans-serif'],
            inter: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background: radial-gradient(circle at top left, #1e1b4b 0%, #0f172a 40%, #020617 100%);
      background-attachment: fixed;
      color: #f1f5f9;
      min-height: 100vh;
    }

    .en-num {
      font-family: 'Inter', system-ui, -apple-system, sans-serif !important;
      direction: ltr;
      display: inline-block;
    }

    .glass-panel {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.3s ease;
    }

    .glass-card:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
    }

    select.glass-dropdown {
      background-color: rgba(15, 23, 42, 0.85);
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.12);
      outline: none;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2310b981' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 0.75rem center;
      background-size: 1.1em;
    }

    select.glass-dropdown option {
      background-color: #0f172a;
      color: #f1f5f9;
    }

    @keyframes pulse-glow {
      0%, 100% {
        box-shadow: 0 0 15px rgba(16, 185, 129, 0.5), inset 0 0 10px rgba(16, 185, 129, 0.3);
        border-color: #10b981;
      }
      50% {
        box-shadow: 0 0 25px rgba(16, 185, 129, 0.85), inset 0 0 15px rgba(16, 185, 129, 0.5);
        border-color: #34d399;
      }
    }

    .active-slot-glow {
      animation: pulse-glow 2s infinite ease-in-out;
      background: rgba(16, 185, 129, 0.15) !important;
    }
  </style>
</head>
<body class="p-3 md:p-6 pb-20">

  <!-- Header -->
  <header class="max-w-7xl mx-auto mb-6">
    <div class="glass-panel rounded-3xl p-4 md:p-6 flex flex-col md:flex-row justify-between items-center gap-4">
      <div class="flex items-center gap-4 w-full md:w-auto justify-between md:justify-start">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center text-white text-2xl shadow-lg shadow-emerald-500/30">
            <i class="fa-solid fa-graduation-cap"></i>
          </div>
          <div>
            <h1 class="text-xl md:text-2xl font-bold font-tajawal text-white">جدول المذاكرة</h1>
            <p class="text-xs text-slate-400 flex items-center gap-2">
              <span id="current-day-badge" class="px-2 py-0.5 rounded-md bg-emerald-500/20 text-emerald-400 font-semibold">...</span>
              <span id="current-clock" class="en-num font-semibold text-slate-300">00:00:00 AM</span>
            </p>
          </div>
        </div>
      </div>

      <div class="hidden md:flex items-center gap-3">
        <div class="text-right leading-tight">
          <div id="sync-status" class="text-xs text-emerald-400 font-medium">Ready</div>
          <div id="last-updated" class="text-[10px] text-slate-400 en-num">Updated: --:--</div>
        </div>
        <button onclick="fetchScheduleData()" class="px-4 py-2.5 rounded-2xl bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-semibold text-sm shadow-lg flex items-center gap-2 transition active:scale-95">
          <i id="sync-icon" class="fa-solid fa-arrows-rotate"></i>
          <span>تحديث البيانات</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Live Banner -->
  <div id="live-banner" class="max-w-7xl mx-auto mb-6 glass-card rounded-2xl p-3 flex items-center gap-3 border-l-4 border-emerald-500">
    <div class="w-10 h-10 rounded-xl bg-emerald-500/20 flex items-center justify-center text-emerald-400 shrink-0">
      <i class="fa-solid fa-clock-rotate-left text-lg"></i>
    </div>
    <div class="overflow-hidden">
      <div class="text-xs text-emerald-400 font-semibold flex items-center gap-2">
        <span>النشاط الحالي الآن</span>
        <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
      </div>
      <p id="live-activity-text" class="text-sm font-bold text-white truncate">جاري المزامنة...</p>
    </div>
  </div>

  <!-- Dynamic KPIs -->
  <section id="dynamic-kpis-container" class="max-w-7xl mx-auto mb-6 grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4">
    <!-- Generated dynamically -->
  </section>

  <!-- Controls Dropdowns & Filters -->
  <section class="max-w-7xl mx-auto mb-6 glass-panel p-4 rounded-3xl flex flex-col md:flex-row items-stretch md:items-center justify-between gap-4">
    <div class="flex flex-col sm:flex-row items-center gap-3 w-full md:w-auto">
      <!-- View Dropdown -->
      <div class="relative w-full sm:w-60">
        <label for="view-dropdown" class="block text-[11px] font-bold text-emerald-400 mb-1">طريقة العرض:</label>
        <select id="view-dropdown" onchange="handleViewChange(this.value)" class="glass-dropdown w-full pr-8 pl-10 py-2.5 rounded-2xl text-sm font-bold border border-emerald-500/30">
          <option value="today">📅 عرض اليوم المحدد</option>
          <option value="full">📊 عرض الجدول الكامل</option>
          <option value="subject">📚 عرض المواد والدروس</option>
        </select>
      </div>

      <!-- Day Dropdown -->
      <div class="relative w-full sm:w-56">
        <label for="day-dropdown" class="block text-[11px] font-bold text-teal-400 mb-1">الفترة / اليوم:</label>
        <select id="day-dropdown" onchange="handleDayChange(this.value)" class="glass-dropdown w-full pr-8 pl-10 py-2.5 rounded-2xl text-sm font-bold border border-teal-500/30">
          <!-- Populated Dynamically -->
        </select>
      </div>
    </div>

    <div class="flex flex-col sm:flex-row items-center gap-3 w-full md:w-auto">
      <div class="relative w-full sm:w-64">
        <input type="text" id="search-input" oninput="handleSearch()" placeholder="بحث باسم المادة أو المدرس..." class="w-full pl-10 pr-4 py-2.5 rounded-2xl glass-card text-sm text-white focus:outline-none focus:ring-2 focus:ring-emerald-500/50">
      </div>

      <!-- Dynamic Filter Pills -->
      <div id="dynamic-pills-container" class="flex items-center gap-1.5 overflow-x-auto w-full sm:w-auto pb-1 sm:pb-0">
        <!-- Generated Dynamically -->
      </div>
    </div>
  </section>

  <!-- Main Views Container -->
  <main class="max-w-7xl mx-auto">
    <div id="view-today" class="view-panel space-y-4">
      <div id="today-cards-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </div>

    <!-- VIEW FULL: Responsive Cards Stacked Vertically -->
    <div id="view-full" class="view-panel hidden">
      <div id="full-cards-stack" class="space-y-4">
        <!-- Generated Dynamically -->
      </div>
    </div>

    <div id="view-subject" class="view-panel hidden">
      <div id="subject-cards-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
    </div>
  </main>

  <!-- Notification Toast -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 ease-in-out glass-panel rounded-2xl px-5 py-3 border-r-4 border-emerald-500 flex items-center gap-3 text-sm text-white">
    <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400 text-lg"></i>
    <span id="toast-msg">Updated successfully</span>
  </div>

  <script>
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR0RtwpCMwrT-zFmmjnC9hpTcZS0sda5QErBFOh-lnTc9HLJT3xY9o_oUdWL_XiNtcJTQh-wwX09XGv/pub?gid=981031067&single=true&output=csv';
    const DAYS = ['السبت', 'الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة'];

    let rawScheduleData = [];
    let activeView = 'today';
    let selectedDayIndex = 0;
    let searchQuery = '';
    let categoryFilter = 'all';

    window.onload = function() {
      detectCurrentDay();
      initDayDropdownOptions();
      initClock();
      fetchScheduleData();
      setInterval(updateLiveHighlight, 30000);
    };

    function getFirstWord(text) {
      if (!text) return '';
      const clean = text.trim().replace(/^[-_\s]+/, '');
      return clean.split(/[\s\-_]+/)[0] || '';
    }

    function detectCurrentDay() {
      const dayNamesArabic = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
      const currentDayName = dayNamesArabic[new Date().getDay()];
      const foundIdx = DAYS.indexOf(currentDayName);
      if (foundIdx !== -1) selectedDayIndex = foundIdx;
    }

    function initDayDropdownOptions() {
      const dropdown = document.getElementById('day-dropdown');
      let html = `<option value="all" ${selectedDayIndex === 'all' ? 'selected' : ''}>📊 الأسبوع كامل (All Week)</option>`;
      DAYS.forEach((day, idx) => {
        const isToday = (idx === selectedDayIndex);
        html += `<option value="${idx}" ${isToday ? 'selected' : ''}>${day} ${isToday ? '(اليوم الحالي)' : ''}</option>`;
      });
      dropdown.innerHTML = html;
    }

    function initClock() {
      setInterval(() => {
        const now = new Date();
        const hours = now.getHours();
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const seconds = String(now.getSeconds()).padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        const formattedHours = String(hours % 12 || 12).padStart(2, '0');
        document.getElementById('current-clock').textContent = `${formattedHours}:${minutes}:${seconds} ${ampm}`;
        document.getElementById('current-day-badge').textContent = now.toLocaleDateString('ar-SA', { weekday: 'long' });
      }, 1000);
    }

    function parseCSVRow(text) {
      const result = [];
      let cell = '';
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        if (c === '"') {
          inQuotes = !inQuotes;
        } else if (c === ',' && !inQuotes) {
          result.push(cell.trim().replace(/^"|"$/g, ''));
          cell = '';
        } else {
          cell += c;
        }
      }
      result.push(cell.trim().replace(/^"|"$/g, ''));
      return result;
    }

    async function fetchScheduleData() {
      showSyncing(true);
      try {
        const response = await fetch(CSV_URL + '&t=' + new Date().getTime());
        if (!response.ok) throw new Error('HTTP network error');
        const csvText = await response.text();
        parseAndRenderCSV(csvText);
        showToast('تم تحديث البيانات بنجاح من الشيت', 'success');
      } catch (err) {
        console.warn('Fetch error:', err);
        showToast('فشل التحديث، تأكد من الاتصال بالإنترنت', 'info');
      } finally {
        showSyncing(false);
        const now = new Date();
        const hours = String(now.getHours() % 12 || 12).padStart(2, '0');
        const mins = String(now.getMinutes()).padStart(2, '0');
        const secs = String(now.getSeconds()).padStart(2, '0');
        const ampm = now.getHours() >= 12 ? 'PM' : 'AM';
        document.getElementById('last-updated').textContent = `Updated: ${hours}:${mins}:${secs} ${ampm}`;
      }
    }

    function showSyncing(isSyncing) {
      const syncIcon = document.getElementById('sync-icon');
      const syncStatus = document.getElementById('sync-status');
      if (syncIcon) {
        if (isSyncing) {
          syncIcon.classList.add('fa-spin');
          if (syncStatus) syncStatus.textContent = 'Syncing...';
        } else {
          syncIcon.classList.remove('fa-spin');
          if (syncStatus) syncStatus.textContent = 'Ready';
        }
      }
    }

    function parseAndRenderCSV(csvText) {
      const lines = csvText.trim().split(/\r?\n/);
      if (lines.length < 2) return;
      rawScheduleData = [];

      for (let i = 1; i < lines.length; i++) {
        const row = parseCSVRow(lines[i]);
        if (row.length >= 2) {
          rawScheduleData.push({
            from: row[0] || '',
            to: row[1] || '',
            'السبت': row[2] || '',
            'الأحد': row[3] || '',
            'الإثنين': row[4] || '',
            'الثلاثاء': row[5] || '',
            'الأربعاء': row[6] || '',
            'الخميس': row[7] || '',
            'الجمعة': row[8] || '',
            notes: row[9] || ''
          });
        }
      }

      generateDynamicKPIsAndPills();
      renderCurrentView();
      updateLiveHighlight();
    }

    function generateDynamicKPIsAndPills() {
      const selectedDayName = selectedDayIndex === 'all' ? 'all' : DAYS[selectedDayIndex];
      const dailyCounts = {};
      const weeklyCounts = {};

      rawScheduleData.forEach(row => {
        DAYS.forEach(day => {
          const val = row[day];
          const word = getFirstWord(val);
          if (word) {
            weeklyCounts[word] = (weeklyCounts[word] || 0) + 1;
            if (selectedDayName !== 'all' && day === selectedDayName) {
              dailyCounts[word] = (dailyCounts[word] || 0) + 1;
            }
          }
        });
      });

      const kpiContainer = document.getElementById('dynamic-kpis-container');
      kpiContainer.innerHTML = '';

      Object.keys(weeklyCounts).forEach(word => {
        const dailyHrs = ((dailyCounts[word] || 0) * 0.5).toFixed(1);
        const weeklyHrs = (weeklyCounts[word] * 0.5).toFixed(1);

        const card = document.createElement('div');
        card.className = 'glass-panel rounded-2xl p-4 flex flex-col justify-between';
        card.innerHTML = `
          <div>
            <div class="text-xs text-slate-400 mb-1">${word} (اليوم)</div>
            <div class="text-xl font-extrabold text-white"><span class="en-num">${dailyHrs}</span> <span class="text-xs text-slate-400">Hours</span></div>
          </div>
          <div class="mt-2 pt-2 border-t border-white/10 text-[11px] text-emerald-400 font-semibold flex justify-between">
            <span>الأسبوع كامل:</span>
            <span class="en-num">${weeklyHrs} Hours</span>
          </div>
        `;
        kpiContainer.appendChild(card);
      });

      const pillsContainer = document.getElementById('dynamic-pills-container');
      pillsContainer.innerHTML = '';

      const allBtn = document.createElement('button');
      allBtn.className = `filter-pill px-3 py-1.5 rounded-xl text-xs font-semibold glass-card ${categoryFilter === 'all' ? 'text-emerald-400 border-emerald-500/30' : 'text-slate-300'}`;
      allBtn.innerText = 'الكل';
      allBtn.onclick = () => { categoryFilter = 'all'; updatePillsUI(); renderCurrentView(); };
      pillsContainer.appendChild(allBtn);

      Object.keys(weeklyCounts).forEach(word => {
        const btn = document.createElement('button');
        btn.className = `filter-pill px-3 py-1.5 rounded-xl text-xs font-semibold glass-card ${categoryFilter === word ? 'text-emerald-400 border-emerald-500/30' : 'text-slate-300'}`;
        btn.innerText = word;
        btn.onclick = () => { categoryFilter = word; updatePillsUI(); renderCurrentView(); };
        pillsContainer.appendChild(btn);
      });
    }

    function updatePillsUI() {
      document.querySelectorAll('.filter-pill').forEach(b => {
        if (b.innerText === categoryFilter || (categoryFilter === 'all' && b.innerText === 'الكل')) {
          b.classList.add('text-emerald-400', 'border-emerald-500/30');
        } else {
          b.classList.remove('text-emerald-400', 'border-emerald-500/30');
        }
      });
    }

    function handleViewChange(val) {
      activeView = val;
      document.querySelectorAll('.view-panel').forEach(el => el.classList.add('hidden'));
      document.getElementById(`view-${val}`).classList.remove('hidden');
      renderCurrentView();
    }

    function handleDayChange(val) {
      selectedDayIndex = val === 'all' ? 'all' : parseInt(val, 10);
      generateDynamicKPIsAndPills();
      renderCurrentView();
      updateLiveHighlight();
    }

    function handleSearch() {
      searchQuery = document.getElementById('search-input').value.trim();
      renderCurrentView();
    }

    function renderCurrentView() {
      if (activeView === 'today') renderTodayView();
      else if (activeView === 'full') renderFullTableView();
      else if (activeView === 'subject') renderSubjectView();
    }

    function renderTodayView() {
      const container = document.getElementById('today-cards-grid');
      container.innerHTML = '';

      const daysToRender = selectedDayIndex === 'all' ? DAYS : [DAYS[selectedDayIndex]];

      daysToRender.forEach(dayName => {
        rawScheduleData.forEach((slot, index) => {
          const activity = slot[dayName] || '';
          if (categoryFilter !== 'all' && getFirstWord(activity) !== categoryFilter) return;
          if (searchQuery && !activity.toLowerCase().includes(searchQuery.toLowerCase())) return;

          const card = document.createElement('div');
          card.className = 'glass-card rounded-2xl p-4 border border-white/10';
          card.id = `today-card-${index}-${dayName}`;
          card.innerHTML = `
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-mono text-emerald-400 en-num font-bold">${slot.from} - ${slot.to}</span>
              <span class="text-[10px] px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 font-bold">${getFirstWord(activity) || 'نشاط'}</span>
            </div>
            <h3 class="text-base font-bold text-white">${activity || '-'}</h3>
            <div class="mt-2 text-[11px] text-slate-400">${dayName}</div>
          `;
          container.appendChild(card);
        });
      });
    }

    /* Render Full Schedule View as Responsive Stacked Cards */
    function renderFullTableView() {
      const stackContainer = document.getElementById('full-cards-stack');
      stackContainer.innerHTML = '';

      rawScheduleData.forEach((slot, index) => {
        // Filter search & category logic for row
        let matchFilter = false;
        DAYS.forEach(day => {
          const act = slot[day] || '';
          if (categoryFilter !== 'all' && getFirstWord(act) === categoryFilter) matchFilter = true;
          if (searchQuery && act.toLowerCase().includes(searchQuery.toLowerCase())) matchFilter = true;
        });

        if (categoryFilter !== 'all' && !matchFilter) return;
        if (searchQuery && !matchFilter && !(slot.notes || '').toLowerCase().includes(searchQuery.toLowerCase())) return;

        // Build days pills inside card
        let daysGridHTML = '';
        DAYS.forEach(day => {
          const val = slot[day]?.trim();
          if (val) {
            daysGridHTML += `
              <div class="flex flex-col items-center justify-center p-2.5 rounded-xl bg-white/5 border border-white/5 text-center">
                <span class="text-[10px] text-emerald-400 font-bold mb-1">${day}</span>
                <span class="text-xs font-semibold text-white">${val}</span>
              </div>
            `;
          }
        });

        const card = document.createElement('div');
        card.className = 'glass-panel rounded-3xl p-5 border border-white/10 space-y-3';
        card.innerHTML = `
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-3 border-b border-white/10">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-sm font-bold">
                <i class="fa-regular fa-clock"></i>
              </div>
              <div class="font-mono text-sm text-emerald-400 en-num font-extrabold">${slot.from} - ${slot.to}</div>
            </div>
            <span class="text-[11px] px-3 py-1 rounded-full bg-slate-800 text-slate-300 w-fit font-bold">فترة زمنية #${index + 1}</span>
          </div>

          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-7 gap-2.5">
            ${daysGridHTML || '<div class="col-span-full text-center text-xs text-slate-500 py-2">لا توجد أنشطة مسجلة في هذا الوقت</div>'}
          </div>

          ${slot.notes ? `
            <div class="pt-2 border-t border-white/5 text-xs text-amber-300/90 flex items-center gap-2">
              <i class="fa-solid fa-note-sticky text-amber-400"></i>
              <span class="font-semibold">ملاحظات:</span>
              <span>${slot.notes}</span>
            </div>
          ` : ''}
        `;

        stackContainer.appendChild(card);
      });
    }

    function renderSubjectView() {
      const container = document.getElementById('subject-cards-container');
      container.innerHTML = '';
      const groups = {};

      const daysToScan = selectedDayIndex === 'all' ? DAYS : [DAYS[selectedDayIndex]];

      rawScheduleData.forEach(slot => {
        daysToScan.forEach(day => {
          const activity = slot[day]?.trim();
          if (!activity) return;
          if (categoryFilter !== 'all' && getFirstWord(activity) !== categoryFilter) return;
          if (searchQuery && !activity.toLowerCase().includes(searchQuery.toLowerCase())) return;

          if (!groups[activity]) groups[activity] = [];
          groups[activity].push({ day, from: slot.from, to: slot.to });
        });
      });

      Object.keys(groups).forEach(subject => {
        const card = document.createElement('div');
        card.className = 'glass-panel rounded-2xl p-5 border border-white/10';
        const listHTML = groups[subject].map(item => `
          <div class="flex justify-between text-xs py-1 px-2 rounded bg-white/5 mb-1">
            <span>${item.day}</span>
            <span class="en-num font-mono text-emerald-400">${item.from} - ${item.to}</span>
          </div>
        `).join('');

        card.innerHTML = `
          <h3 class="text-base font-bold text-white mb-3">${subject}</h3>
          <div>${listHTML}</div>
        `;
        container.appendChild(card);
      });
    }

    function updateLiveHighlight() {
      const now = new Date();
      const currentMin = now.getHours() * 60 + now.getMinutes();
      const dayNamesArabic = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
      const todayName = dayNamesArabic[now.getDay()];

      let activeActivity = null;
      rawScheduleData.forEach((slot) => {
        const start = parseTimeToMinutes(slot.from);
        const end = parseTimeToMinutes(slot.to);
        if (currentMin >= start && currentMin < end) {
          activeActivity = slot[todayName];
        }
      });

      const banner = document.getElementById('live-activity-text');
      if (banner) {
        banner.textContent = activeActivity ? `${todayName}: ${activeActivity}` : 'خارج أوقات الجدول الحالية';
      }
    }

    function parseTimeToMinutes(timeStr) {
      if (!timeStr) return 0;
      const match = timeStr.trim().match(/^(\d+):(\d+)\s*(AM|PM)$/i);
      if (!match) return 0;
      let h = parseInt(match[1]), m = parseInt(match[2]), ampm = match[3].toUpperCase();
      if (ampm === 'PM' && h < 12) h += 12;
      if (ampm === 'AM' && h === 12) h = 0;
      return h * 60 + m;
    }

    function showToast(msg, type = 'success') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');
      const toastIcon = document.getElementById('toast-icon');
      if (!toast) return;

      toastMsg.textContent = msg;
      if (type === 'success') {
        toastIcon.className = 'fa-solid fa-circle-check text-emerald-400 text-lg';
      } else {
        toastIcon.className = 'fa-solid fa-circle-info text-blue-400 text-lg';
      }

      toast.classList.remove('translate-y-20', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');

      setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3500);
    }
  </script>
</body>
